<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSH Web Console</title>
  <style>
    body { margin: 0; background: #0b0f16; color: #d6deeb; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { padding: 6px 10px; border: 1px solid #2b3a4a; border-radius: 999px; font-size: 12px; color: #9fb4ff; }
    #term { background: #08101a; border: 1px solid #1c2a3a; border-radius: 10px; padding: 12px; height: 72vh; overflow: auto; white-space: pre; line-height: 1.35; }
    .row { display: flex; gap: 10px; margin-top: 10px; }
    #cmd { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #1c2a3a; background: #0b0f16; color: #d6deeb; }
    button { padding: 12px 16px; border-radius: 10px; border: 1px solid #1c2a3a; background: #0b0f16; color: #9fb4ff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .hint { margin-top: 8px; opacity: .8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="chip" id="ws">WS: disconnected</div>
      <div class="chip" id="cwd">CWD: -</div>
    </div>

    <div id="term"></div>

    <div class="row">
      <input id="cmd" placeholder='Например: ls | cd mydir | mkdir test | rmr test' autocomplete="off" />
      <button id="send">Send</button>
    </div>

    <div class="hint">Команды: ls, cd, pwd, mkdir, rm, rmdir, rmr, help</div>
  </div>

<script>
(() => {
  const term = document.getElementById('term');
  const cmd = document.getElementById('cmd');
  const send = document.getElementById('send');
  const wsLabel = document.getElementById('ws');
  const cwdLabel = document.getElementById('cwd');

  function print(s) {
    term.textContent += s;
    if (!s.endsWith("\n")) term.textContent += "\n";
    term.scrollTop = term.scrollHeight;
  }

  function promptLine(cwd, input) {
    print(`${cwd} > ${input}`);
  }

  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = `${proto}://${location.host}/ws`;
  let ws;

  function setState(ok) {
    wsLabel.textContent = `WS: ${ok ? "connected" : "disconnected"}`;
    send.disabled = !ok;
  }

  function connect() {
    ws = new WebSocket(url);

    ws.onopen = () => {
      setState(true);
      print(`[client] connected: ${url}`);
      cmd.focus();
    };

    ws.onclose = () => {
      setState(false);
      print("[client] disconnected");
    };

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { print(ev.data); return; }

      if (msg.cwd) {
        cwdLabel.textContent = "CWD: " + msg.cwd;
        window.__cwd = msg.cwd;
      }

      if (msg.ok) {
        if (msg.output) print(msg.output.trimEnd());
      } else {
        print("[error] " + (msg.error || "unknown error"));
      }
    };

    ws.onerror = () => print("[client] ws error");
  }

  function sendCmd() {
    const v = cmd.value.trim();
    if (!v) return;
    const cwd = window.__cwd || "/";
    promptLine(cwd, v);
    ws.send(JSON.stringify({ cmd: v }));
    cmd.value = "";
    cmd.focus();
  }

  send.onclick = sendCmd;
  cmd.addEventListener("keydown", (e) => { if (e.key === "Enter") sendCmd(); });

  setState(false);
  connect();
})();
</script>
</body>
</html>
